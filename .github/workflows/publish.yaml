name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-cgate-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: cgate-server

jobs:
  test:
    uses: ./.github/workflows/checks.yaml

  init:
    name: Prepare build matrix
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve add-on version
        id: version
        run: |
          version="$(awk '/^version:/{print $2; exit}' cgate-server/config.yaml | tr -d "\"'")"
          if [ -z "${version}" ]; then
            echo "::error::Could not read version from cgate-server/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

      - name: Validate release and refuse existing or older image versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-release.py

      - name: Prepare matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [init, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test release image with real C-Gate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          platform="linux/${ARCH}"
          if [ "$ARCH" = aarch64 ]; then platform=linux/arm64; fi
          docker build --platform "$platform" -t cgate-release-check ./cgate-server
          python3 tests/integration.py cgate-release-check

      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./cgate-server
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          push: true
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # build-image does not set revision; without this, published images
          # record no commit provenance.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
